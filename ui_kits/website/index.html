/* ==========================================================================
   VP Equities / VP Buys Homes — Core Foundations
   Colors, typography, spacing, radii, shadows, motion
   Source of truth: vp-equities-brand-guidelines.html (2025)
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap');

:root {
  /* --------------------------------------------------------------------
     COLOR — canonical brand palette (from brand guidelines, section 02)
     80% navy · 20% amber · white/tint for breathing room
     -------------------------------------------------------------------- */

  /* Primary */
  --navy:       #1B365D;   /* True Navy — primary brand */
  --navy-deep:  #0F2040;   /* deeper navy (for gradients, over-navy cards) */
  --navy-mid:   #264D80;   /* mid tone for eyebrows on light */
  --navy-900:   #0D1B2A;   /* Near Black — body text */

  /* Accent */
  --amber:      #F2A65A;   /* Warm Amber — CTA / accent ONLY */
  --amber-dark: #D4862E;   /* hover / pressed amber */

  /* Surfaces */
  --white:      #FFFFFF;
  --light:      #EEF2F7;   /* page tint — digital backgrounds */
  --border:     #D1DCE8;   /* hairline on light */

  /* Neutrals */
  --dark:       #0D1B2A;   /* body text */
  --gray-900:   #111827;
  --gray-700:   #374151;
  --gray-500:   #6B7280;   /* caption / meta */
  --gray-400:   #9CA3AF;
  --gray-300:   #CBD5E1;
  --gray-100:   #F3F4F6;

  /* Semantic */
  --success:    #15803D;
  --success-bg: #DCFCE7;
  --warning:    #B45309;
  --warning-bg: #FEF3E2;
  --danger:     #B42318;
  --danger-bg:  #FEE4E2;

  /* Semantic aliases */
  --bg:        var(--white);
  --bg-tint:   var(--light);
  --bg-navy:   var(--navy);
  --bg-deep:   var(--navy-deep);

  --fg:        var(--dark);
  --fg-muted:  var(--gray-500);
  --fg-subtle: var(--gray-400);
  --fg-invert: var(--white);
  --fg-brand:  var(--navy);
  --fg-accent: var(--amber);

  --border-ink:   var(--navy);
  --border-hair:  var(--border);

  /* --------------------------------------------------------------------
     TYPE — Two families only (section 03)
     Barlow Semi Condensed = all headlines / display
     Nunito Sans           = all body / UI
     -------------------------------------------------------------------- */

  --fh: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
  --fb: 'Montserrat', 'Helvetica Neue', system-ui, sans-serif;
  --fm: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Legacy aliases for convenience */
  --font-head: var(--fh);
  --font-body: var(--fb);

  /* Type scale — tuned to brand specimen */
  --fs-mega:    72px;   /* hero display */
  --fs-h1:      56px;
  --fs-h2:      38px;   /* section title from spec */
  --fs-h3:      28px;
  --fs-h4:      22px;
  --fs-h5:      18px;
  --fs-lead:    18px;
  --fs-body:    15px;
  --fs-body-sm: 13px;
  --fs-cap:     11px;   /* eyebrow / meta — UPPERCASE tracked */
  --fs-micro:   10px;

  --lh-tight: 1.0;
  --lh-snug:  1.15;
  --lh-base:  1.7;      /* body is noticeably open (spec: 1.7) */
  --lh-ui:    1.5;

  --tr-display: 0.02em; /* Barlow display tracking */
  --tr-cap:     0.14em; /* small label */
  --tr-eyebrow: 0.18em; /* tiny eyebrow */
  --tr-upper:   0.06em; /* button uppercase */

  /* --------------------------------------------------------------------
     SPACING — 4px base
     -------------------------------------------------------------------- */
  --s-0:  0;
  --s-1:  4px;
  --s-2:  8px;
  --s-3:  12px;
  --s-4:  16px;
  --s-5:  20px;
  --s-6:  24px;
  --s-8:  32px;
  --s-10: 40px;
  --s-12: 48px;
  --s-14: 56px;
  --s-16: 64px;
  --s-18: 72px;   /* section vertical padding from spec */
  --s-20: 80px;
  --s-24: 96px;
  --s-32: 128px;

  /* --------------------------------------------------------------------
     RADII — modest, professional (matches brand docs: 4–10px)
     -------------------------------------------------------------------- */
  --r-xs:  3px;
  --r-sm:  4px;
  --r-md:  6px;
  --r-lg:  8px;    /* canonical card radius */
  --r-xl:  10px;
  --r-2xl: 14px;
  --r-pill: 999px;

  /* --------------------------------------------------------------------
     SHADOWS — cool/neutral, subtle. Cards are quiet, CTAs are confident.
     -------------------------------------------------------------------- */
  --shadow-xs: 0 1px 2px rgba(13, 27, 42, 0.06);
  --shadow-sm: 0 2px 6px rgba(13, 27, 42, 0.06), 0 1px 2px rgba(13, 27, 42, 0.04);
  --shadow-md: 0 4px 14px rgba(13, 27, 42, 0.10), 0 2px 4px rgba(13, 27, 42, 0.04);
  --shadow-lg: 0 10px 30px rgba(13, 27, 42, 0.12), 0 4px 10px rgba(13, 27, 42, 0.06);
  --shadow-xl: 0 24px 48px rgba(13, 27, 42, 0.18), 0 10px 20px rgba(13, 27, 42, 0.08);
  --shadow-amber: 0 6px 20px rgba(242, 166, 90, 0.35);

  /* Rings */
  --ring-amber: 0 0 0 3px rgba(242, 166, 90, 0.45);
  --ring-navy:  0 0 0 3px rgba(27, 54, 93, 0.25);

  /* --------------------------------------------------------------------
     MOTION — fast, direct (no bounce, no dawdling)
     -------------------------------------------------------------------- */
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out:   cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast:  120ms;
  --dur-med:   200ms;
  --dur-slow:  360ms;

  /* Layout */
  --container-max:   1200px;
  --container-tight: 960px;
}

/* ==========================================================================
   SEMANTIC DEFAULTS
   ========================================================================== */

html, body {
  font-family: var(--fb);
  font-size: var(--fs-body);
  line-height: var(--lh-base);
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Playfair Display — title-case serif; italic reserved for emphasis */
.display, h1, .h1 {
  font-family: var(--fh);
  font-size: var(--fs-h1);
  line-height: var(--lh-tight);
  letter-spacing: 0.005em;
  font-weight: 700;
  color: var(--navy);
  text-wrap: balance;
}

.hero-display {
  font-family: var(--fh);
  font-size: var(--fs-mega);
  font-weight: 700;
  line-height: var(--lh-tight);
  letter-spacing: 0;
  color: var(--navy);
  text-wrap: balance;
}

h2, .h2 {
  font-family: var(--fh);
  font-size: var(--fs-h2);
  line-height: 1.08;
  letter-spacing: 0.005em;
  font-weight: 700;
  color: var(--navy);
  text-wrap: balance;
}

h3, .h3 {
  font-family: var(--fh);
  font-size: var(--fs-h3);
  line-height: var(--lh-snug);
  letter-spacing: 0.005em;
  font-weight: 700;
  color: var(--navy);
}

h4, .h4 {
  font-family: var(--fh);
  font-size: var(--fs-h4);
  line-height: var(--lh-snug);
  letter-spacing: 0;
  font-weight: 600;
  color: var(--navy);
}

h5, .h5 {
  font-family: var(--fh);
  font-size: var(--fs-h5);
  line-height: var(--lh-snug);
  font-weight: 600;
  color: var(--navy);
}

/* Italic emphasis token — amber italic inside serif headings, per brand */
h1 em, h2 em, h3 em, .display em, .hero-display em {
  font-style: italic;
  font-weight: 600;
  color: var(--amber);
}

p, .body {
  font-size: var(--fs-body);
  line-height: var(--lh-base);
  color: var(--gray-700);
  text-wrap: pretty;
}

.lead {
  font-size: var(--fs-lead);
  line-height: 1.6;
  color: var(--gray-700);
  text-wrap: pretty;
}

.caption {
  font-size: var(--fs-body-sm);
  color: var(--gray-500);
  line-height: var(--lh-base);
}

.eyebrow {
  font-family: var(--fb);
  font-size: var(--fs-cap);
  font-weight: 700;
  letter-spacing: var(--tr-cap);
  text-transform: uppercase;
  color: var(--amber);
  line-height: 1;
}

.eyebrow--navy { color: var(--navy-mid); }
.eyebrow--white { color: rgba(255, 255, 255, 0.4); }

.micro-label {
  font-family: var(--fb);
  font-size: var(--fs-micro);
  font-weight: 600;
  letter-spacing: var(--tr-eyebrow);
  text-transform: uppercase;
  color: var(--gray-500);
}

a {
  color: var(--navy);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  transition: color var(--dur-fast) var(--ease-standard);
}
a:hover { color: var(--amber-dark); }

/* Selection */
::selection {
  background: var(--amber);
  color: var(--white);
}

:focus-visible {
  outline: none;
  box-shadow: var(--ring-amber);
  border-radius: var(--r-sm);
}

</style>
<style>
  html,body{margin:0;padding:0;background:#fff;color:var(--dark);scroll-behavior:smooth;overflow-x:hidden;-webkit-text-size-adjust:100%}
  *{box-sizing:border-box}
  img,svg{max-width:100%}
  .container{max-width:1200px;margin:0 auto;padding:0 28px}
  /* Header */
  .site-hdr{position:sticky;top:0;background:rgba(255,255,255,.88);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid transparent;z-index:50;transition:border-color 200ms}
  .site-hdr.scr{border-bottom-color:var(--border)}
  .hdr-inner{display:flex;align-items:center;justify-content:space-between;height:72px}
  .logo{display:flex;align-items:center;gap:6px;text-decoration:none}
  .logo .vp{font-family:var(--fh);font-size:24px;font-weight:700;color:var(--navy);letter-spacing:.005em;line-height:1}
  .logo .div{width:1px;height:22px;background:rgba(27,54,93,.2);margin:0 3px}
  .logo .eq{font-family:var(--fh);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--navy);text-transform:uppercase;line-height:1}
  .nav{display:flex;gap:32px;align-items:center}
  .nav a{font-family:var(--fb);font-size:13px;font-weight:600;color:var(--dark);text-decoration:none;letter-spacing:.02em;white-space:nowrap;transition:color 120ms}
  .nav a:hover{color:var(--amber-dark)}
  /* Mobile hamburger */
  .hdr-mobile{display:none;align-items:center;gap:10px}
  .hdr-call{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:rgba(242,166,90,.12);color:var(--amber-dark);text-decoration:none;border:1px solid rgba(242,166,90,.3)}
  .hdr-call:active{background:rgba(242,166,90,.22)}
  .hdr-burger{display:flex;flex-direction:column;justify-content:center;gap:4px;width:42px;height:42px;border-radius:8px;background:none;border:1px solid var(--border);cursor:pointer;padding:0;align-items:center}
  .hdr-burger span{display:block;width:18px;height:2px;background:var(--navy);border-radius:2px;transition:transform 200ms,opacity 150ms}
  .hdr-burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .hdr-burger.open span:nth-child(2){opacity:0}
  .hdr-burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  .mob-drawer{position:fixed;top:64px;left:0;right:0;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 12px 32px rgba(15,26,51,.12);z-index:99;transform:translateY(-12px);opacity:0;pointer-events:none;transition:transform 220ms var(--ease-out),opacity 180ms;padding:18px 22px 22px;display:flex;flex-direction:column;gap:4px}
  .mob-drawer.open{transform:translateY(0);opacity:1;pointer-events:auto}
  .mob-drawer a{font-family:var(--fb);font-size:16px;font-weight:600;color:var(--dark);text-decoration:none;padding:14px 4px;border-bottom:1px solid var(--border);min-height:44px;display:flex;align-items:center}
  .mob-drawer a:last-child{border-bottom:none}
  .mob-drawer .mob-cta{margin-top:14px;background:var(--amber);color:#fff;border-radius:6px;padding:14px 18px;font-family:var(--fb);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;justify-content:center;border-bottom:none;text-align:center}
  .mob-drawer .mob-phone{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:700;letter-spacing:.04em}
  .mob-drawer .mob-phone .p{color:var(--amber);font-family:var(--fh);margin-right:0}
  .nav-cta{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:var(--amber);color:#fff;font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border-radius:4px;text-decoration:none;white-space:nowrap;transition:background 120ms}
  .nav-cta:hover{background:var(--amber-dark);color:#fff}
  .phn{font-family:var(--fb);font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--navy)}
  .phn .p{color:var(--amber);margin-right:4px}

  /* Hero */
  .hero{background:var(--navy);color:#fff;padding:84px 0 120px;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;right:-80px;top:-100px;width:420px;height:420px;border-radius:50%;border:72px solid rgba(255,255,255,.04)}
  .hero::after{content:'';position:absolute;right:60px;bottom:-120px;width:240px;height:240px;border-radius:50%;border:40px solid rgba(255,255,255,.03)}
  .hero-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:center;position:relative;z-index:1}
  .hero-eb{display:inline-flex;align-items:center;gap:8px;font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:18px}
  .hero-eb::before{content:'';width:24px;height:2px;background:var(--amber)}
  .hero h1{font-family:var(--fh);font-size:64px;font-weight:700;letter-spacing:.005em;color:#fff;line-height:1.04;margin:0 0 24px;text-wrap:balance}

  .hero-sub{font-family:var(--fb);font-size:17px;line-height:1.65;color:rgba(255,255,255,.72);max-width:520px;margin:0 0 28px}

  .hero-ctas{display:flex;gap:12px;align-items:center}
  .btn-amber{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;background:var(--amber);color:#fff;font-family:var(--fb);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:none;border-radius:4px;text-decoration:none;box-shadow:var(--shadow-amber);cursor:pointer;transition:all 120ms var(--ease-standard)}
  .btn-amber:hover{background:var(--amber-dark);transform:translateY(-1px);color:#fff}
  .btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;background:transparent;color:#fff;font-family:var(--fb);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:1.5px solid rgba(255,255,255,.3);border-radius:4px;text-decoration:none;cursor:pointer;transition:all 120ms}
  .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.06);color:#fff}

  /* Offer form card in hero */

  .offer-btn{width:100%;margin-top:4px;padding:15px;background:var(--amber);color:#fff;font-family:var(--fb);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:none;border-radius:4px;cursor:pointer;box-shadow:var(--shadow-amber);transition:all 120ms}

  .ticker-item{display:inline-flex;align-items:center;gap:14px;font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.78);flex-shrink:0}
  .ticker-item .tloc{color:#fff}
  .ticker-item .tdays{color:var(--amber)}
  .ticker-item .sep{width:5px;height:5px;border-radius:50%;background:var(--amber);opacity:.6}

  .ambient-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;pointer-events:none;z-index:1;mask-image:radial-gradient(ellipse at 30% 40%,black,transparent 75%)}

  /* --- Variant 2: MARQUEE + PARALLAX --- */
  .v-marquee{min-height:760px}
  .v-marquee .khero-body{padding:96px 0 72px}
  .marquee-bg{position:absolute;inset:0;display:flex;gap:72px;padding:40px 0;z-index:0;pointer-events:none}
  .mcol{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(180deg,transparent 0%,black 18%,black 82%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0%,black 18%,black 82%,transparent 100%)}
  .mcol-track{display:flex;flex-direction:column;gap:28px;animation:mup 40s linear infinite;will-change:transform}
  .mcol:nth-child(even) .mcol-track{animation:mdown 48s linear infinite}
  .mcol-track span{font-family:var(--fh);font-size:68px;font-weight:700;letter-spacing:-.005em;color:rgba(255,255,255,.07);line-height:.95;white-space:nowrap;font-style:italic}
  .mcol:nth-child(3n) .mcol-track span{color:rgba(242,166,90,.06)}
  @keyframes mup{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
  @keyframes mdown{0%{transform:translateY(-50%)}100%{transform:translateY(0)}}

  .v-marquee .khero-content{position:relative;z-index:3}
  .v-marquee .mark-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(242,166,90,.14);border:1px solid rgba(242,166,90,.35);border-radius:999px;font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:24px}
  .v-marquee .mark-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 1.6s infinite}

  .v-marquee .kh-headline{font-size:96px;line-height:.96;letter-spacing:-.015em;font-weight:700}
  .v-marquee .kh-headline .flash{display:inline-block;position:relative;color:var(--amber);font-style:italic;font-weight:600;padding:0 4px}
  .v-marquee .kh-headline .flash::before{content:'';position:absolute;inset:6% -4px;background:rgba(242,166,90,.14);border-radius:3px;z-index:-1;transform:skewX(-8deg)}

  .parallax-house{position:absolute;right:-40px;top:20%;opacity:.08;z-index:1;transform:translateY(var(--py,0px));transition:transform 200ms linear}

  /* --- Variant 3: STAMP / POSTAL --- */
  .v-stamp{min-height:720px;background:#F4EEE3;color:var(--dark)}
  .v-stamp.khero{background:#F4EEE3;color:var(--dark)}
  .paper-texture{position:absolute;inset:0;background:
    radial-gradient(circle at 20% 30%,rgba(13,27,42,.04) 1px,transparent 1px),
    radial-gradient(circle at 80% 70%,rgba(13,27,42,.03) 1px,transparent 1px),
    repeating-linear-gradient(0deg,transparent 0 38px,rgba(13,27,42,.025) 38px 39px);
  background-size:3px 3px,2px 2px,auto;pointer-events:none;z-index:0}
  .v-stamp .khero-body{padding:72px 0 60px}
  .v-stamp .khero-lhs{position:relative;z-index:2}
  .postal-bar{display:flex;align-items:center;gap:20px;padding-bottom:16px;border-bottom:2px dashed rgba(13,27,42,.25);margin-bottom:32px;font-family:var(--fm,ui-monospace);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-500);font-weight:600}
  .postal-bar .dot{width:8px;height:8px;border-radius:50%;background:#C22B2B;box-shadow:0 0 0 3px rgba(194,43,43,.15)}
  .postal-bar .ts{margin-left:auto;font-family:var(--fm,ui-monospace);color:var(--navy)}

  .v-stamp .kh-headline{color:var(--navy);font-size:88px;line-height:.98;font-weight:700;letter-spacing:-.01em}
  .v-stamp .kh-headline em{font-style:italic;font-weight:500;color:var(--navy);letter-spacing:0}
  .v-stamp .kh-headline .amber{color:var(--amber-dark);font-style:italic;font-weight:600}
  .v-stamp .kh-sub{color:var(--gray-700);max-width:460px}

  .postmark{position:absolute;top:56px;right:-18px;width:210px;height:210px;border:3px solid var(--amber-dark);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);z-index:3;color:var(--amber-dark);opacity:.92;animation:stampBounce 900ms var(--ease-out) .3s both}
  .postmark::before{content:'';position:absolute;inset:10px;border:1.5px dashed var(--amber-dark);border-radius:50%;opacity:.6}
  .postmark .pm-inner{text-align:center;font-family:var(--fb);text-transform:uppercase}
  .postmark .pm-inner .t1{font-size:12px;font-weight:700;letter-spacing:.22em;display:block;margin-bottom:4px}
  .postmark .pm-inner .t2{font-family:var(--fh);font-size:40px;font-weight:700;letter-spacing:-.01em;line-height:1;font-style:italic;text-transform:none}
  .postmark .pm-inner .t3{font-size:10px;letter-spacing:.24em;font-weight:600;display:block;margin-top:6px;opacity:.8}
  @keyframes stampBounce{0%{transform:rotate(-12deg) scale(2.2);opacity:0}60%{transform:rotate(-12deg) scale(.92);opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:.92}}

  .recpt{background:#fff;border:1px solid rgba(13,27,42,.15);border-radius:4px;padding:20px 22px 14px;position:relative;box-shadow:0 6px 24px rgba(13,27,42,.12);margin-top:24px}
  .recpt::before,.recpt::after{content:'';position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 6px 0,#F4EEE3 5px,transparent 6px);background-size:12px 10px;background-repeat:repeat-x}
  .recpt::before{top:-10px;transform:scaleY(-1)}
  .recpt::after{bottom:-10px}
  .recpt .rhd{font-family:var(--fm,ui-monospace);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-500);display:flex;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed rgba(13,27,42,.2)}
  .recpt .rrow{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--fm,ui-monospace);font-size:13px;padding:6px 0;color:var(--navy)}
  .recpt .rrow .lbl{color:var(--gray-500);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .recpt .rrow.total{border-top:2px dashed rgba(13,27,42,.2);padding-top:12px;margin-top:8px;font-family:var(--fb);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:700}
  .recpt .rrow.total .val{color:var(--amber-dark);font-size:15px;font-weight:700;letter-spacing:.04em;font-family:var(--fh);font-style:italic;text-transform:none}
  .v-stamp .offer-card{border-radius:2px;border:1.5px solid rgba(13,27,42,.18);box-shadow:0 10px 30px rgba(13,27,42,.15),0 2px 6px rgba(13,27,42,.08)}
  .v-stamp .offer-card::before{background:var(--navy)}
  .v-stamp .offer-eb{color:var(--navy);font-family:var(--fm,ui-monospace);letter-spacing:.18em}

  /* ============ Variant 4: EPIC — full lead form ============ */
  .v-epic{
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    position:relative;
    overflow:hidden;
    min-height:auto;
    display:block;
    padding:0;
  }
  /* Layered ambient BG */
  .epic-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .epic-grid{
    position:absolute;inset:-10%;
    background-image:
      linear-gradient(rgba(242,166,90,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(242,166,90,.06) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black 0%,transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black 0%,transparent 80%);
    animation:epicGridDrift 60s linear infinite;
  }
  .v-epic.motion-low .epic-grid{animation:none;opacity:.5}
  .v-epic.motion-high .epic-grid{animation-duration:30s;opacity:.9}
  @keyframes epicGridDrift{
    0%{transform:translate(0,0)}
    100%{transform:translate(64px,64px)}
  }
  .epic-orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;mix-blend-mode:screen}
  .epic-orb.o1{top:-20%;left:-15%;width:620px;height:620px;background:radial-gradient(circle,rgba(38,77,128,.85),transparent 70%);animation:epicOrbA 22s ease-in-out infinite}
  .epic-orb.o2{top:25%;right:-15%;width:540px;height:540px;background:radial-gradient(circle,rgba(242,166,90,.32),transparent 70%);animation:epicOrbB 26s ease-in-out infinite}
  .epic-orb.o3{bottom:-20%;left:25%;width:560px;height:560px;background:radial-gradient(circle,rgba(38,77,128,.6),transparent 70%);animation:epicOrbA 30s ease-in-out infinite reverse}
  .v-epic.motion-low .epic-orb{animation:none}
  .v-epic.motion-high .epic-orb{opacity:.7}
  @keyframes epicOrbA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.1)}}
  @keyframes epicOrbB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,30px) scale(1.05)}}
  .epic-vignette{position:absolute;inset:0;background:radial-gradient(ellipse 110% 90% at 50% 45%,transparent 35%,rgba(15,32,64,.55) 85%,rgba(13,27,42,.85) 100%)}

  /* Live bar */
  .epic-livebar{position:relative;z-index:2;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(10,22,40,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .epic-livebar-inner{display:flex;align-items:center;gap:10px;padding:11px 28px;font-family:var(--fb);font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.02em}
  .epic-livedot{width:7px;height:7px;border-radius:50%;background:#3FCF8E;box-shadow:0 0 0 0 rgba(63,207,142,.6);animation:epicPulse 1.6s ease-in-out infinite}
  @keyframes epicPulse{0%,100%{box-shadow:0 0 0 0 rgba(63,207,142,.5)}50%{box-shadow:0 0 0 6px rgba(63,207,142,0)}}
  .epic-livelbl{font-weight:700;color:#3FCF8E;letter-spacing:.18em;text-transform:uppercase;font-size:10.5px}
  .epic-livesep{color:rgba(255,255,255,.3)}
  .epic-livetext{animation:epicLiveFade 4s ease-in-out;color:rgba(255,255,255,.85)}
  .epic-livetext b{color:#fff;font-weight:600}
  .epic-liveago{color:rgba(255,255,255,.45);margin-left:4px}
  @keyframes epicLiveFade{0%{opacity:0;transform:translateX(8px)}10%,90%{opacity:1;transform:translateX(0)}100%{opacity:.6}}

  /* Stage */
  .epic-stage{position:relative;z-index:2;padding:88px 28px 88px;max-width:980px;text-align:center}
  .epic-eb{display:inline-flex;align-items:center;gap:10px;font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-bottom:24px}
  .epic-eb-line{width:30px;height:2px;background:var(--amber)}

  /* Headline — large, expressive, multi-line */
  .epic-h1{
    font-family:var(--fh);
    font-weight:700;
    font-size:clamp(40px, 7.2vw, 88px);
    line-height:1.02;
    letter-spacing:-.015em;
    color:#fff;
    margin:0 0 22px;
    text-wrap:balance;
  }
  .epic-h1 span{display:block}
  .epic-h1-l1{}
  .epic-h1-l2{color:var(--amber);font-style:italic;font-weight:600;font-family:var(--fh)}
  .epic-h1-l3{}
  .epic-sub{
    font-family:var(--fb);
    font-size:clamp(15px, 1.3vw, 18px);
    line-height:1.6;
    color:rgba(255,255,255,.72);
    max-width:620px;
    margin:0 auto 32px;
    transition:opacity 200ms;
  }

  /* Situation chips */
  .epic-chips-wrap{margin:0 auto 36px;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .epic-chips-lbl{font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);text-align:center}
  .epic-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
  .epic-chip{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 14px;
    width:100%;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    font-family:var(--fb);font-size:13px;font-weight:500;
    color:rgba(255,255,255,.85);
    cursor:pointer;
    transition:all 160ms var(--ease-standard);
  }
  .epic-chip:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);transform:translateY(-1px)}
  .epic-chip.active{background:var(--amber);border-color:var(--amber);color:#fff}
  .epic-chip-ico{
    width:20px;height:20px;border-radius:50%;
    background:rgba(242,166,90,.15);color:var(--amber);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--fh);font-size:11px;font-weight:700;
  }
  .epic-chip.active .epic-chip-ico{background:rgba(255,255,255,.22);color:#fff}

  /* Lead intake form (full) */
  .epic-form{
    max-width:760px;margin:0 auto;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:26px 28px 22px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    text-align:left;
  }
  .epic-form-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px;flex-wrap:wrap}
  .epic-form-title{font-family:var(--fh);font-size:20px;font-weight:700;color:#fff;letter-spacing:-.005em;line-height:1.2;margin:0}
  .epic-form-cap{font-family:var(--fb);font-size:12.5px;color:rgba(255,255,255,.55);margin:4px 0 0}
  .epic-form-step{display:inline-flex;align-items:center;gap:6px;font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
  .epic-form-step .num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--amber);color:var(--navy-deep);font-size:10px;font-weight:700;letter-spacing:0}
  .epic-fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .epic-field{display:flex;flex-direction:column;gap:6px;position:relative}
  .epic-field.full{grid-column:1/-1}
  .epic-label{font-family:var(--fb);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .epic-label .req{color:var(--amber);margin-left:3px}
  .epic-control{
    width:100%;
    background:rgba(255,255,255,.96);
    border:1px solid transparent;
    border-radius:8px;
    padding:13px 14px;
    font-family:var(--fb);font-size:15px;color:var(--navy-900);
    outline:none;
    transition:border-color 140ms,box-shadow 140ms,background 140ms;
    -webkit-appearance:none;appearance:none;
  }
  .epic-control::placeholder{color:rgba(13,27,42,.4)}
  .epic-control:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,166,90,.25);background:#fff}
  select.epic-control{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1l5 5 5-5' stroke='%231B365D' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;cursor:pointer}
  textarea.epic-control{min-height:78px;resize:vertical;font-family:var(--fb);line-height:1.5}
  .epic-submit-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;flex-wrap:wrap}
  .epic-submit{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--amber);color:#fff;
    border:none;border-radius:8px;
    padding:15px 26px;
    font-family:var(--fb);font-size:13px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 12px 30px -8px rgba(242,166,90,.55);
    transition:background 160ms,transform 160ms,box-shadow 160ms;
  }
  .epic-submit:hover{background:var(--amber-dark);transform:translateY(-1px);box-shadow:0 16px 36px -10px rgba(242,166,90,.7)}
  .epic-submit:active{transform:scale(.98)}
  .epic-submit-meta{font-family:var(--fb);font-size:12px;color:rgba(255,255,255,.55);line-height:1.5}
  .epic-submit-meta b{color:#fff;font-weight:600}
  .epic-form-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font-family:var(--fb);font-size:12px;color:rgba(255,255,255,.55)}
  .epic-meta-item{display:inline-flex;align-items:center;gap:6px}
  .epic-meta-item svg{color:#3FCF8E;flex-shrink:0}

  /* Success state */
  .epic-success{
    max-width:760px;margin:0 auto;
    background:linear-gradient(135deg,rgba(63,207,142,.14),rgba(63,207,142,.04));
    border:1px solid rgba(63,207,142,.4);
    border-radius:14px;padding:32px 32px;
    text-align:center;
    animation:epicEstIn 420ms var(--ease-out);
  }
  @keyframes epicEstIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .epic-success-icon{width:56px;height:56px;border-radius:50%;background:#3FCF8E;display:inline-flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px}
  .epic-success-h{font-family:var(--fh);font-size:24px;font-weight:700;color:#fff;letter-spacing:-.005em;margin:0 0 8px}
  .epic-success-p{font-family:var(--fb);font-size:14.5px;color:rgba(255,255,255,.75);line-height:1.6;margin:0 auto 16px;max-width:480px}
  .epic-success-num{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;font-family:var(--fb);font-size:13.5px;font-weight:600;color:#fff}
  .epic-success-num svg{color:var(--amber)}
  /* Urgency strip */
  .epic-urgency{
    margin-top:24px;display:inline-flex;align-items:center;gap:10px;
    padding:9px 16px;border-radius:999px;
    font-family:var(--fb);font-size:12px;font-weight:500;
    color:rgba(255,255,255,.85);
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
  }
  .epic-urgency .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
  .epic-urgency .dot.pulse{animation:epicPulse 1.6s ease-in-out infinite}
  .epic-urgency.u-hard{background:rgba(242,166,90,.12);border-color:rgba(242,166,90,.4);color:#fff}
  .epic-urgency.u-scarcity{background:rgba(232,140,72,.1);border-color:rgba(232,140,72,.3)}

  /* Trust strip */
  .epic-trust{
    display:flex;align-items:center;justify-content:center;
    gap:36px;
    margin:48px auto 0;
    flex-wrap:wrap;
    padding:24px 0 0;
    border-top:1px solid rgba(255,255,255,.08);
    max-width:820px;
  }
  .epic-trust-item{display:flex;align-items:center;gap:12px;text-align:left}
  .epic-trust-divider{width:1px;height:32px;background:rgba(255,255,255,.1)}
  .epic-trust-stars{display:flex;gap:1px}
  .epic-trust-num{font-family:var(--fh);font-size:32px;font-weight:700;color:var(--amber);line-height:1}
  .epic-trust-bbb{
    font-family:var(--fh);font-size:18px;font-weight:700;color:#fff;
    width:34px;height:34px;border-radius:6px;
    background:rgba(242,166,90,.15);border:1.5px solid var(--amber);
    display:flex;align-items:center;justify-content:center;letter-spacing:0;
  }
  .epic-trust-meta{display:flex;flex-direction:column;gap:1px;font-family:var(--fb);font-size:13px;color:#fff;line-height:1.3}
  .epic-trust-meta b{font-weight:600}
  .epic-trust-meta span{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.04em}

  /* Secondary CTA */
  .epic-secondary{
    margin-top:32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;
    font-family:var(--fb);font-size:13px;color:rgba(255,255,255,.55);
  }
  .epic-secondary-link,.epic-secondary-link2{
    display:inline-flex;align-items:center;gap:6px;
    color:#fff;text-decoration:none;font-weight:600;
    transition:color 120ms;
  }
  .epic-secondary-link:hover,.epic-secondary-link2:hover{color:var(--amber)}
  .epic-secondary-link svg{color:var(--amber)}
  .epic-secondary-sep{color:rgba(255,255,255,.2)}

  /* Epic — mobile */
  @media (max-width:768px){
    .epic-livebar-inner{padding:9px 18px;font-size:11px;flex-wrap:wrap}
    .epic-livetext{font-size:11.5px;line-height:1.5}
    .epic-stage{padding:60px 18px 60px}
    .epic-eb{margin-bottom:18px;font-size:10px;letter-spacing:.18em}
    .epic-h1{margin:0 0 16px}
    .epic-sub{margin:0 auto 24px;font-size:14.5px}
    .epic-chips-wrap{margin-bottom:24px;gap:10px}
    .epic-chips{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .epic-chip{font-size:12.5px;padding:9px 10px;gap:6px}
    .epic-chip-ico{width:18px;height:18px;font-size:10px}
    .epic-form{padding:20px 18px}
    .epic-form-head{margin-bottom:14px;gap:10px}
    .epic-form-title{font-size:18px}
    .epic-fgrid{grid-template-columns:1fr;gap:8px}
    .epic-control{font-size:16px;padding:12px 13px}
    .epic-submit{width:100%;justify-content:center;padding:14px}
    .epic-submit-row{flex-direction:column;align-items:stretch}
    .epic-submit-meta{text-align:center}
    .epic-form-meta{font-size:11px;gap:10px 14px;justify-content:center}
    .epic-trust{gap:18px;padding-top:20px;margin-top:36px}
    .epic-trust-divider{display:none}
    .epic-trust-item{flex:1 0 calc(50% - 18px);min-width:0;justify-content:flex-start}
    .epic-trust-num{font-size:26px}
    .epic-secondary{font-size:12px;gap:10px}
    .epic-secondary-sep{display:none}
    .epic-orb{filter:blur(60px)}
    .epic-orb.o1{width:340px;height:340px}
    .epic-orb.o2{width:300px;height:300px}
    .epic-orb.o3{width:340px;height:340px}
  }
  @media (max-width:420px){
    .epic-stage{padding:36px 14px 48px}
    .epic-h1{font-size:34px;letter-spacing:-.01em}
    .epic-chips{grid-template-columns:1fr;gap:6px}
    .epic-chip{padding:11px 14px;font-size:13px}
    .epic-trust{gap:14px}
    .epic-trust-item{flex:1 0 100%}
    .epic-trust-meta{flex:1}
  }
  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    .epic-grid,.epic-orb,.epic-livedot,.epic-livetext{animation:none}
  }

  /* ============ Multi-step offer card ============ */
  .oc-stepper{display:flex;gap:6px;margin-bottom:18px}
  .oc-stepper .dot{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background 200ms}
  .oc-stepper .dot.active{background:var(--amber)}
  .oc-stepper .dot.done{background:var(--navy)}

  .est-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);border-radius:8px;padding:18px 20px;color:#fff;margin:14px 0 18px;position:relative;overflow:hidden}
  .est-card::before{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:20px solid rgba(242,166,90,.1)}
  .est-card .elab{font-family:var(--fb);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;position:relative}
  .est-card .erange{font-family:var(--fh);font-size:28px;font-weight:700;line-height:1.1;color:#fff;letter-spacing:-.01em;position:relative}
  .est-card .erange em{font-style:italic;color:var(--amber);font-weight:600}
  .est-card .enote{font-family:var(--fb);font-size:11px;color:rgba(255,255,255,.6);margin-top:6px;line-height:1.5;position:relative}

  .est-shimmer{display:inline-block;width:140px;height:28px;background:linear-gradient(90deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.08) 100%);background-size:200% 100%;border-radius:4px;animation:shim 1.4s linear infinite}
  @keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}

  /* chip selector */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
  .chip{padding:9px 14px;background:#fff;border:1px solid var(--border);border-radius:999px;font-family:var(--fb);font-size:12px;font-weight:600;color:var(--gray-700);cursor:pointer;transition:all 120ms;letter-spacing:.02em}
  .chip:hover{border-color:var(--navy-mid);color:var(--navy)}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip.amber.active{background:var(--amber);border-color:var(--amber);color:#fff}
  .field{margin-bottom:14px}
  .field-lbl{font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gray-500);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .field-lbl .opt{color:var(--gray-400);font-weight:600;letter-spacing:.1em}

  /* photo upload */
  .photo-drop{border:2px dashed var(--border);border-radius:8px;padding:22px 16px;text-align:center;cursor:pointer;transition:all 160ms;background:var(--gray-100)}
  .photo-drop:hover,.photo-drop.drag{border-color:var(--amber);background:rgba(242,166,90,.06)}
  .photo-drop .pi{width:36px;height:36px;border-radius:50%;background:rgba(242,166,90,.15);color:var(--amber-dark);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:18px}
  .photo-drop .pt{font-family:var(--fb);font-size:13px;font-weight:600;color:var(--navy);margin-bottom:4px}
  .photo-drop .ps{font-family:var(--fb);font-size:11px;color:var(--gray-500);letter-spacing:.02em}
  .photo-drop input{display:none}
  .photo-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  .photo-thumbs .thumb{aspect-ratio:1/1;border-radius:6px;background:var(--navy);position:relative;overflow:hidden;border:1px solid var(--border)}
  .photo-thumbs .thumb img{width:100%;height:100%;object-fit:cover}
  .photo-thumbs .thumb .rm{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(13,27,42,.85);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}

  /* SMS consent row */
  .sms-row{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:rgba(242,166,90,.08);border:1px solid rgba(242,166,90,.3);border-radius:8px;margin-bottom:12px;cursor:pointer}
  .sms-row input[type="checkbox"]{accent-color:var(--amber-dark);margin-top:2px;cursor:pointer;width:16px;height:16px;flex-shrink:0}
  .sms-row .sms-lbl{font-family:var(--fb);font-size:12px;line-height:1.5;color:var(--navy)}
  .sms-row .sms-lbl b{display:block;margin-bottom:2px;font-weight:700}
  .sms-row .sms-lbl span{color:var(--gray-500);font-size:10.5px;letter-spacing:.02em}

  /* secondary button */
  .btn-secondary{padding:12px 18px;background:#fff;color:var(--navy);font-family:var(--fb);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border:1.5px solid var(--border);border-radius:4px;cursor:pointer;transition:all 120ms}
  .btn-secondary:hover{border-color:var(--navy);background:var(--gray-100)}

  /* Confirmation success screen */
  .conf{padding:20px 6px;text-align:center}
  .conf .check{width:56px;height:56px;border-radius:50%;background:var(--amber);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:18px;animation:pop 400ms var(--ease-out)}
  @keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  .conf .ch{font-family:var(--fh);font-size:24px;font-weight:700;color:var(--navy);margin-bottom:8px;line-height:1.2}
  .conf .ch em{font-style:italic;color:var(--amber);font-weight:600}
  .conf .cs{font-family:var(--fb);font-size:13.5px;color:var(--gray-700);line-height:1.6;margin-bottom:18px}
  .conf .cs b{color:var(--navy)}
  .conf .timeline{display:flex;justify-content:space-between;gap:8px;padding:16px;background:var(--gray-100);border-radius:8px;margin-bottom:14px;text-align:left}
  .conf .timeline .ti{flex:1}
  .conf .timeline .tnum{font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
  .conf .timeline .ttxt{font-family:var(--fb);font-size:11px;color:var(--gray-700);line-height:1.4}
  .conf .textback{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:rgba(21,128,61,.08);border:1px solid rgba(21,128,61,.3);border-radius:6px;font-family:var(--fb);font-size:11.5px;font-weight:600;color:#15803D;letter-spacing:.02em}

  /* Verification step */
  .dev-code{padding:8px 12px;background:rgba(21,128,61,.06);border:1px dashed rgba(21,128,61,.35);border-radius:6px;margin-bottom:14px;font-family:var(--fb);font-size:11px;color:#15803D}
  .dev-code code{font-family:'SF Mono',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.18em;margin-left:4px;color:var(--navy)}
  .code-in{font-family:'SF Mono',ui-monospace,monospace !important;font-size:22px !important;font-weight:700;letter-spacing:.5em;text-align:center;padding:14px !important}
  .field-err{font-family:var(--fb);font-size:11.5px;color:#b91c1c;margin-top:6px}
  .verify-foot{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-family:var(--fb);font-size:11.5px;color:var(--gray-700)}
  .verify-foot .lnk{background:none;border:none;font:inherit;color:var(--navy);text-decoration:underline;cursor:pointer;padding:0}
  .verify-foot .lnk:hover{color:var(--amber)}
  .verify-foot .lnk:disabled{color:var(--gray-700);opacity:.6;cursor:not-allowed;text-decoration:none}

  /* ============ Mobile sticky CTA bar ============ */
  .m-cta{position:fixed;left:12px;right:12px;bottom:12px;z-index:998;display:none;gap:8px;padding:10px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px -8px rgba(15,26,51,.25),0 4px 12px -4px rgba(15,26,51,.12);transform:translateY(120%);transition:transform 320ms var(--ease-out)}
  .m-cta.show{transform:translateY(0)}
  .m-cta-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;border-radius:8px;font-family:var(--fb);font-size:13px;font-weight:700;letter-spacing:.02em;text-decoration:none;transition:transform 120ms var(--ease-out),background 160ms}
  .m-cta-btn.call,.m-cta-btn.text{background:var(--gray-100);color:var(--navy);border:1px solid var(--border);flex:0 0 auto;padding:0 14px}
  .m-cta-btn.call:active,.m-cta-btn.text:active{transform:scale(.97);background:var(--border)}
  .m-cta-btn.primary{background:var(--amber);color:#fff;box-shadow:0 4px 12px -2px rgba(242,166,90,.45)}
  .m-cta-btn.primary:active{transform:scale(.97);background:var(--amber-deep)}
  .m-cta-btn svg{flex-shrink:0}
  @media (max-width: 768px){
    .m-cta{display:flex}
    /* Push page content so sticky bar doesn't sit over footer */
    .ftr{padding-bottom:96px !important}
  }

  /* ============ Exit-intent modal ============ */
  .exit-overlay{position:fixed;inset:0;z-index:9998;background:rgba(15,26,51,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:exitFade 220ms var(--ease-out)}
  @keyframes exitFade{from{opacity:0}to{opacity:1}}
  .exit-modal{position:relative;display:grid;grid-template-columns:minmax(0,0.95fr) minmax(0,1fr);max-width:880px;width:100%;max-height:min(92vh, 720px);overflow:hidden;background:#fff;border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45),0 12px 40px -12px rgba(0,0,0,.25);animation:exitIn 280ms var(--ease-out)}
  @keyframes exitIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .exit-x{position:absolute;top:12px;right:14px;z-index:2;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid var(--border);color:var(--gray-700);font-size:22px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background 160ms,color 160ms}
  .exit-x:hover{background:#fff;color:var(--navy)}
  .exit-left{position:relative;padding:40px 36px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .exit-left::before{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(242,166,90,.14)}
  .exit-left::after{content:'';position:absolute;left:-40px;bottom:-80px;width:180px;height:180px;border-radius:50%;border:18px solid rgba(242,166,90,.08)}
  .exit-eb{font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--amber);margin-bottom:14px;position:relative}
  .exit-h{font-family:var(--fh);font-size:36px;font-weight:700;line-height:1.05;letter-spacing:-.02em;margin-bottom:14px;position:relative}
  .exit-h em{font-style:italic;color:var(--amber);font-weight:600}
  .exit-p{font-family:var(--fb);font-size:14px;line-height:1.6;color:rgba(255,255,255,.78);margin:0 0 18px;position:relative;max-width:360px}
  .exit-bullets{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;position:relative}
  .exit-bullets li{font-family:var(--fb);font-size:13px;color:rgba(255,255,255,.88);display:flex;gap:10px;align-items:center}
  .exit-bullets li span{color:var(--amber);font-weight:700}
  .exit-right{padding:36px 32px;overflow-y:auto;display:flex;flex-direction:column;justify-content:center}
  .exit-sent{text-align:center;padding:20px 0}
  .exit-sent .check{width:52px;height:52px;border-radius:50%;background:var(--amber);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;animation:pop 400ms var(--ease-out)}
  .exit-sent .ch{font-family:var(--fh);font-size:22px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .exit-sent .cs{font-family:var(--fb);font-size:13.5px;color:var(--gray-700);line-height:1.6}
  .exit-sent .cs b{color:var(--navy)}
  @media (max-width: 720px){
    .exit-modal{grid-template-columns:1fr;max-height:94vh}
    .exit-left{padding:28px 24px 24px}
    .exit-left::before{width:140px;height:140px;right:-50px;top:-50px;border-width:18px}
    .exit-left::after{display:none}
    .exit-h{font-size:26px}
    .exit-p{font-size:13px}
    .exit-bullets{display:none}
    .exit-right{padding:22px 24px 28px}
  }

  /* Tweaks panel ============ */
  .tweaks{position:fixed;right:16px;bottom:16px;z-index:9999;background:var(--navy);color:#fff;border-radius:10px;padding:14px 16px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;gap:10px;width:240px;font-family:var(--fb)}
  .tweaks.open{display:flex;animation:tweaksIn 200ms var(--ease-out)}
  @keyframes tweaksIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .tweaks h6{margin:0;font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
  .tweaks .opts{display:flex;flex-direction:column;gap:6px}
  .tweaks .opt{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;cursor:pointer;font-size:12.5px;color:rgba(255,255,255,.8);transition:all 120ms;text-align:left;font-family:var(--fb)}
  .tweaks .opt:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
  .tweaks .opt.active{background:rgba(242,166,90,.14);border-color:var(--amber);color:#fff}
  .tweaks .opt .k{font-family:var(--fh);font-size:10px;letter-spacing:.12em;color:var(--amber);font-weight:700;text-transform:uppercase;width:36px;flex-shrink:0}

  @media (max-width:960px){
    .khero-body{grid-template-columns:1fr;padding:56px 0 40px}
    .counter-huge{font-size:108px}
    .counter-huge .unit{font-size:42px}
    .kh-headline{font-size:48px}
    .v-marquee .kh-headline{font-size:52px}
    .v-stamp .kh-headline{font-size:46px}
    .postmark{display:none}
  }

  /* Trust band */
  .trust{background:var(--light);padding:36px 0;border-bottom:1px solid var(--border)}
  .trust-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
  .stat{border-left:2px solid var(--amber);padding-left:18px;min-width:0}
  .stat .n{font-family:var(--fh);font-size:40px;font-weight:700;color:var(--navy);letter-spacing:-.005em;line-height:1;margin-bottom:6px}

  /* Trust pillars */
  .trust-pillars{padding:72px 0}
  .trust-pillars-grid{display:grid;grid-template-columns:1.1fr 2fr;gap:64px;align-items:center}
  .trust-pillars-h{font-size:36px;color:#fff}
  .trust-pillars-sub{font-size:15px;color:rgba(255,255,255,.6)}
  .trust-pillars-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
  .trust-pillar{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
  .trust-pillar-ico{color:var(--amber)}
  .trust-pillar-lbl{font-family:var(--fb);font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#fff}
  .trust-pillar-desc{font-family:var(--fb);font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.6);max-width:200px}
  @media (max-width:960px){
    .trust-pillars{padding:56px 0}
    .trust-pillars-grid{grid-template-columns:1fr;gap:36px}
    .trust-pillars-h{font-size:30px}
  }
  @media (max-width:640px){
    .trust-pillars-list{grid-template-columns:1fr;gap:28px}
    .trust-pillar-desc{max-width:340px}
    .trust-pillars-h{font-size:26px}
  }
  .stat .n em{font-style:italic;color:var(--amber);font-weight:600}
  .stat .l{font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gray-500)}

  /* Section generic */
  .sec{padding:88px 0;border-bottom:1px solid var(--border)}
  .sec.alt{background:var(--light)}
  .sec.dark{background:var(--navy);color:#fff;border:none}
  .sec-head{max-width:620px;margin-bottom:52px}
  .eyb{font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
  .sec-h{font-family:var(--fh);font-size:44px;font-weight:700;letter-spacing:-.005em;color:var(--navy);line-height:1.1;margin:0 0 18px;text-wrap:balance}
  .sec-h em{font-style:italic;color:var(--amber);font-weight:600}
  .sec.dark .sec-h{color:#fff}
  .sec-sub{font-family:var(--fb);font-size:17px;color:var(--gray-500);line-height:1.65;margin:0;max-width:560px}
  .sec.dark .sec-sub{color:rgba(255,255,255,.6)}

  /* How it works */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .step{background:#fff;border:1px solid var(--border);border-radius:10px;padding:28px 24px;position:relative;transition:all 200ms var(--ease-standard)}
  .step:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .step .num{font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-bottom:14px}
  .step .big{font-family:var(--fh);font-size:84px;font-weight:700;color:var(--light);line-height:.85;position:absolute;top:20px;right:22px;letter-spacing:-.02em;z-index:0;font-style:italic}
  .step .ct{position:relative;z-index:1}
  .step h3{font-family:var(--fh);font-size:24px;font-weight:700;color:var(--navy);letter-spacing:0;margin:0 0 10px;line-height:1.2}
  .step p{font-size:14px;color:var(--gray-500);line-height:1.7;margin:0}

  /* Benefits (Why us) */
  .benefits{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
  .benefits .pic{aspect-ratio:4/3;border-radius:10px;background:linear-gradient(135deg,#1B365D 0%,#264D80 100%);position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
  .benefits .pic::before{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;border:40px solid rgba(255,255,255,.04)}
  .benefits .pic-tag{position:absolute;left:22px;bottom:22px;right:22px;color:#fff}
  .benefits .pic-tag .eb{font-family:var(--fb);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
  .benefits .pic-tag .tt{font-family:var(--fh);font-size:26px;font-weight:700;letter-spacing:0;line-height:1.1}
  .ben-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:18px}
  .ben-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}

  /* Footer */
  .ftr{background:#0A1E33;color:rgba(255,255,255,.55);padding:56px 0 28px}
  .ftr-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:48px;margin-bottom:40px}

  .ftr-phone{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(242,166,90,.12);border:1px solid rgba(242,166,90,.3);border-radius:6px;font-family:var(--fb);font-size:13px;font-weight:700;letter-spacing:.02em;color:#fff;text-decoration:none;transition:background 160ms,border-color 160ms}

<script type="text/babel" data-presets="react">

// ===== Logo.jsx =====

          <a href="#offer" className="nav-cta nav-cta-hdr">Get Offer</a>

          <a href="tel:9125156060" className="hdr-call" aria-label="Call (912) 515-6060">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

// ===== Hero.jsx =====
// KINETIC HERO — 4 variants switchable via Tweaks panel
const HERO_VARIANTS = /*EDITMODE-BEGIN*/{
  "variant": "epic",
  "headline": "pain",
  "urgency": "soft",
  "motion": "medium"
}/*EDITMODE-END*/;

// Recent closings data for ticker
const CLOSINGS = [
  { loc: 'Rincon', days: 9, cond: 'Inherited' },
  { loc: 'Statesboro', days: 11, cond: 'As-is' },
  { loc: 'Savannah', days: 7, cond: 'Pre-foreclosure' },
  { loc: 'Metter', days: 14, cond: 'Tenant-occupied' },
  { loc: 'Pooler', days: 8, cond: 'Estate' },
  { loc: 'Springfield', days: 10, cond: 'Relocation' },
  { loc: 'Brooklet', days: 12, cond: 'Divorce' },
  { loc: 'Guyton', days: 9, cond: 'Foundation' },
];

// Animated counter hook
const useCountUp = (target, duration = 1800) => {
  const [n, setN] = React.useState(0);
  React.useEffect(() => {
    let raf; const start = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setN(Math.round(target * eased));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return n;
};

// Email validation helper
const isValidEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((e||'').trim());
// Mock verification code — real site sends via email/Resend API
const genCode = () => String(Math.floor(100000 + Math.random() * 900000));

// Shared offer card — multi-step: capture → detail → email verify → confirm
const OfferCard = ({ compact = false }) => {
  const [step, setStep] = React.useState(1); // 1 capture, 2 detail, 3 verify, 4 confirm
  const [data, setData] = React.useState({
    name: '', phone: '', email: '', address: '',
    beds: 3, baths: 2, sqft: '', condition: '',
    timeline: '', liens: '', askingPrice: '', notes: '',
    photos: [], smsOptIn: true,
  });
  const [emailVerified, setEmailVerified] = React.useState(false);
  const [verifyCode, setVerifyCode] = React.useState('');
  const [enteredCode, setEnteredCode] = React.useState('');
  const [verifyError, setVerifyError] = React.useState('');
  const [resendCooldown, setResendCooldown] = React.useState(0);
  const fileRef = React.useRef(null);

  const update = (k, v) => setData(d => ({ ...d, [k]: v }));

  // cooldown timer
  React.useEffect(() => {
    if (resendCooldown <= 0) return;
    const id = setTimeout(() => setResendCooldown(c => c - 1), 1000);
    return () => clearTimeout(id);
  }, [resendCooldown]);

  const sendVerification = () => {
    // In production: POST to /api/send-verification { email }
    // Mock: generate a code and "display" it so demo reviewers can verify
    const code = genCode();
    setVerifyCode(code);
    setResendCooldown(30);
    setVerifyError('');
    // eslint-disable-next-line no-console
    console.log('[VP mock] verification code for', data.email, '=', code);
  };

  const submitStep1 = (e) => {
    e.preventDefault();
    if (!data.name || !data.phone || !data.address || !isValidEmail(data.email)) return;
    setStep(2);
  };

  const submitStep2 = (e) => {
    e.preventDefault();
    // Move to verification step; fire a code
    sendVerification();
    setStep(3);
  };

  const submitVerify = (e) => {
    e.preventDefault();
    if (enteredCode.trim() === verifyCode) {
      setEmailVerified(true);
      setStep(4);
    } else {
      setVerifyError('That code doesn\'t match. Check your inbox or resend below.');
    }
  };

  const handleFiles = (files) => {
    const next = [...data.photos];
    Array.from(files).slice(0, 8 - next.length).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const url = URL.createObjectURL(file);
      next.push({ url, name: file.name });
    });
    update('photos', next);
  };

  const removePhoto = (i) => {
    const next = [...data.photos];
    next.splice(i, 1);
    update('photos', next);
  };

  // ============ CONFIRMATION ============
  if (step === 4) {
    return (
      <div className="offer-card">
        <div className="oc-stepper"><span className="dot done"/><span className="dot done"/><span className="dot done"/></div>
        <div className="conf">
          <div className="check"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
          <div className="ch">Got it, {data.name.split(' ')[0] || 'neighbor'} — <em>offer incoming.</em></div>
          <div className="cs">We're reviewing <b>{data.address}</b>. Your written cash offer will arrive within 24 hours.</div>

          <div className="timeline">
            <div className="ti"><div className="tnum">Now</div><div className="ttxt">Acquisitions review</div></div>
            <div className="ti"><div className="tnum">24 hr</div><div className="ttxt">Written offer to you</div></div>
            <div className="ti"><div className="tnum">7–21 d</div><div className="ttxt">Close — your date</div></div>
          </div>
          {data.smsOptIn && (
            <div className="textback">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
              <span>We'll text your offer to {data.phone}. Reply STOP anytime.</span>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ============ EMAIL VERIFICATION ============
  if (step === 3) {
    return (
      <form className="offer-card" onSubmit={submitVerify}>
        <div className="oc-stepper"><span className="dot done"/><span className="dot done"/><span className="dot active"/></div>
        <div className="offer-eb">Final step · Confirm your email</div>
        <h3 className="offer-h">Enter your verification code</h3>
        <p className="offer-sub">We sent a 6-digit code to <b>{data.email}</b>. Enter it below so we can send your written offer to the right inbox.</p>

        {/* Dev hint — remove in production */}
        {verifyCode && (
          <div className="dev-code">Demo code: <code>{verifyCode}</code></div>
        )}

        <div className="field">
          <div className="field-lbl">6-digit code</div>
          <input className="in code-in" placeholder="000000" maxLength="6" inputMode="numeric"
            value={enteredCode} onChange={e=>{setEnteredCode(e.target.value.replace(/[^\d]/g,''));setVerifyError('')}} autoFocus />
          {verifyError && <div className="field-err">{verifyError}</div>}
        </div>

          <button type="button" className="btn-secondary" onClick={()=>setStep(2)} style={{flexShrink:0}}>← Back</button>

// ===== ExitIntent.jsx =====
const ExitIntent = () => {
  const [open, setOpen] = React.useState(false);
  const [name, setName] = React.useState('');
  const [phone, setPhone] = React.useState('');
  const [address, setAddress] = React.useState('');
  const [sent, setSent] = React.useState(false);
  const firedRef = React.useRef(false);

  React.useEffect(() => {
    // Only fire once per session, and respect dismissal for 24h
    try {
      const dismissed = localStorage.getItem('vp_exit_dismissed');
      if (dismissed && Date.now() - Number(dismissed) < 24 * 60 * 60 * 1000) {
        firedRef.current = true;
        return;
      }
    } catch {}

    const onMouseLeave = (e) => {
      if (firedRef.current) return;
      // Desktop: pointer exits top of viewport
      if (e.clientY <= 0 && e.relatedTarget == null) {
        firedRef.current = true;
        setOpen(true);
      }
    };
    // Mobile fallback: scroll-up intent after the user is deep in page
    let lastY = window.scrollY;
    const onScroll = () => {
      if (firedRef.current) return;
      const y = window.scrollY;
      if (y > 1200 && lastY - y > 40) {
        firedRef.current = true;
        setOpen(true);
      }
      lastY = y;
    };
    document.addEventListener('mouseleave', onMouseLeave);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      document.removeEventListener('mouseleave', onMouseLeave);
      window.removeEventListener('scroll', onScroll);
    };
  }, []);

  const close = () => {
    setOpen(false);
    try { localStorage.setItem('vp_exit_dismissed', String(Date.now())); } catch {}
  };

  const submit = (e) => {
    e.preventDefault();
    if (!name || !phone) return;
    setSent(true);
    try { localStorage.setItem('vp_exit_dismissed', String(Date.now())); } catch {}
  };

  if (!open) return null;

  return (
    <div className="exit-overlay" onClick={close} role="dialog" aria-modal="true" aria-label="Before you go">
      <div className="exit-modal" onClick={e=>e.stopPropagation()}>
        <button className="exit-x" onClick={close} aria-label="Close">×</button>
        <div className="exit-left" aria-hidden="true">
          <div className="exit-eb">Before you go</div>
          <div className="exit-h"><em>Text me</em> my offer</div>
          <p className="exit-p">Leave your number and property address. We'll text your written cash offer within 24 hours — no emails, no pressure.</p>
          <ul className="exit-bullets">
            <li><span>·</span>Written offer, no obligation</li>
            <li><span>·</span>Close on your date — 7 to 21 days</li>
            <li><span>·</span>We buy as-is, any condition</li>
          </ul>
        </div>
        <div className="exit-right">
          {sent ? (
            <div className="exit-sent">
              <div className="check"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
              <div className="ch">Thanks, {name.split(' ')[0] || 'neighbor'}.</div>
              <div className="cs">We'll text your offer to <b>{phone}</b> within 24 hours.</div>
              <button type="button" className="offer-btn" style={{marginTop:10}} onClick={close}>Close</button>
            </div>
          ) : (
            <form onSubmit={submit}>
              <div className="offer-eb">Text me my offer</div>
              <h3 className="offer-h" style={{marginBottom:4}}>One more thing</h3>
              <p className="offer-sub">Takes 15 seconds. We'll send a written cash offer by SMS.</p>
              <div className="field"><input className="in" placeholder="Full name" value={name} onChange={e=>setName(e.target.value)} required/></div>
              <div className="field"><input className="in" type="tel" placeholder="Phone number" value={phone} onChange={e=>setPhone(e.target.value)} required/></div>
              <div className="field"><input className="in" placeholder="Property address (optional)" value={address} onChange={e=>setAddress(e.target.value)}/></div>
              <button type="submit" className="offer-btn" style={{marginTop:4}}>Text Me My Offer</button>
              <div className="offer-foot" style={{marginTop:10,justifyContent:'center'}}><span className="dot"/>Reply STOP anytime · No obligation</div>
            </form>
          )}
        </div>
      </div>
    </div>
  );
};
window.ExitIntent = ExitIntent;
